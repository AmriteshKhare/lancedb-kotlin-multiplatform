[package]
name = "lancedb_kmp"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["lib", "cdylib", "staticlib"]
name = "lancedb_kmp"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
arrow-array = "58"
arrow-schema = "58"
fastembed = "5"
futures = "0.3"
lancedb = "0.30"
openssl-sys = { version = "0.9", features = ["vendored"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread"] }
uniffi = { version = "0.28.3", features = ["cli"] }

[build-dependencies]

[dev-dependencies]
tempfile = "3"
